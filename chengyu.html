t:1.45;font-weight:500}.tip{margin-top:10px;padding:9px 11px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:12px;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:9px}.card{background:var(--card-bg);border:.5px solid var(--intensity-8);border-radius:12px;padding:12px;cursor:pointer;transition:.15s}.card:hover,.card.selected{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 5%,var(--card-bg))}.cardhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.cardword{font-size:15px;font-weight:600}.mini{font-size:10px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 6px;border-radius:999px;white-space:nowrap}.line{font-size:11px;line-height:1.45;margin-top:4px}.line b{font-weight:500;color:var(--text-secondary)}.misuse{color:var(--destructive);font-size:11px;line-height:1.4;margin-top:7px}.foot{font-size:11px;color:var(--text-tertiary);margin-top:12px}@media(max-width:650px){.focusgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.search{width:100%}.title{width:100%;margin-right:0}}

<div class="app"><div class="bar"><div class="title">国考成语与实词完整四维记忆卡</div><span class="count" id="count">0 张</span><input class="search" id="search" placeholder="搜索词语或含义"/><select class="select" id="tone"><option value="all">全部色彩</option><option value="褒义">褒义</option><option value="中性">中性</option><option value="贬义">贬义</option><option value="褒贬">褒贬视语境</option></select></div><div class="tabs"><button class="pill active" data-kind="all">全部词类</button><button class="pill" data-kind="成语">成语</button><button class="pill" data-kind="实词">实词</button></div><div class="groups" id="groups"></div><div class="stats"><div class="stat"><b id="allN">0</b><span>当前去重总数</span></div><div class="stat"><b id="idiomN">0</b><span>成语卡片</span></div><div class="stat"><b id="wordN">0</b><span>实词卡片</span></div></div><div class="focus"><div class="top"><span class="word" id="fw">防微杜渐</span><span class="tag" id="fk">成语</span><span class="group" id="fg">预防与解决</span></div><div class="focusgrid"><div class="cell"><div class="label">核心义</div><div class="value" id="fm">问题刚露苗头时及时制止</div></div><div class="cell"><div class="label">适用对象</div><div class="value" id="fo">错误苗头、风险隐患、不良趋势</div></div><div class="cell"><div class="label">感情色彩</div><div class="value" id="ft">褒义</div></div><div class="cell"><div class="label">常见误用</div><div class="value" id="fu">误作事情发生后的补救</div></div></div><div class="tip" id="fp">记忆钩子：看到苗头先预防，不等问题扩大。</div></div><div class="grid" id="grid"></div><div class="foot">本版本加入数量核对：卡片数量由实际去重后的数据动态计算，不再手动写死。</div></div>
<script>
const idioms=[['预防与解决','防微杜渐','问题刚露苗头时及时制止','错误苗头、风险隐患、不良趋势','褒义','误作事情发生后的补救','看到苗头先预防，不等问题扩大。'],['预防与解决','曲突徙薪','事先采取措施排除可能发生的危险','火灾隐患、风险防范、事故预防','褒义','误作事情发生后的补救','危险未发生，先把隐患搬走。'],['预防与解决','未雨绸缪','事先做好准备，防患于未然','计划、预案、储备、应急准备','褒义','误作临时应对或事后补救','雨还没下，先修好门窗。'],['预防与解决','见微知著','从细小迹象推知本质或发展趋势','苗头、细节、趋势、早期信号','褒义','误作只看局部、认识片面','先判断趋势，不等于立即解决。'],['预防与解决','釜底抽薪','从根本上消除问题原因','制度弊端、根源问题、长期隐患','褒义','误作一般性缓解措施','抽掉锅底柴，问题从根上解决。'],['预防与解决','正本清源','从根本上整顿治理','制度、思想、行业整顿','褒义','误作只处理表面现象','正根本、清源头。'],['预防与解决','扬汤止沸','采取表面措施暂时缓解问题','短期应对、表面治理','贬义','误作彻底解决问题','舀水倒水，只能暂时不沸。'],['预防与解决','抱薪救火','用错误方法处理问题反而加重','错误决策、失败应对','贬义','误作积极解决困难','抱柴救火，越救越旺。'],['改革与创新','推陈出新','批判继承旧事物并创造新事物','文化、制度、思想、技术','褒义','误作完全抛弃传统','旧中取精华，再创造新。'],['改革与创新','革故鼎新','革除旧制度旧事物建立新局面','制度、政治、社会改革','褒义','误作一般小幅改进','破旧立新，改革力度较大。'],['改革与创新','吐故纳新','排出旧的吸收新的','组织、思想、知识更新','褒义','误作只保留旧内容','旧的出去，新的进来。'],['改革与创新','破旧立新','破除旧思想旧制度建立新的','观念、制度、机制、文化','褒义','误作渐进改良','先破后立，强调新秩序。'],['改革与创新','另辟蹊径','另开路径采用不同寻常的方法','解题、发展、技术路线','褒义','误作彻底改革制度','重点是方法路径不同。'],['改革与创新','独出心裁','办法或设计独特新颖','艺术、设计、方案、构思','褒义','误作制度改革','重点是构思别致。'],['改革与创新','标新立异','故意提出新奇主张显示不同','观点、言论、风格、行为','褒贬视语境','误作一律褒义创新','有时创新，有时刻意求异。'],['改革与创新','别出心裁','构思巧妙独特','文章、设计、活动、方案','褒义','误作彻底推翻旧事物','重在新颖巧妙。'],['改革与创新','与时俱进','随时代发展而不断进步','思想、理论、制度、观念','褒义','误作只追求新奇','重点是适应时代。'],['改革与创新','因时制宜','根据不同时期情况采取措施','政策、策略、制度、安排','褒义','误作根据地区调整','依据的是时间条件。'],['改革与创新','墨守成规','固守旧规矩不肯改变','思想、制度、工作方式','贬义','误作遵守规范的褒义','问题在于僵化保守。'],['改革与创新','固步自封','满足已有成绩不求进步','个人、组织、学术、事业','贬义','误作坚持传统','重点是自我满足。'],['改革与创新','抱残守缺','固守残缺落后的旧事物','思想、制度、文化、观念','贬义','误作保护传统文化','重点是舍不得放弃落后部分。'],['态度与作风','脚踏实地','做事踏实认真不浮夸','工作、学习、作风、实践','褒义','误作行动迟缓','重点是务实稳健。'],['态度与作风','实事求是','从实际出发探求规律','思想、工作、决策、研究','褒义','误作只讲现实利益','重点是尊重事实和规律。'],['态度与作风','求真务实','追求真实讲究实际效果','工作作风、政策落实、研究实践','褒义','误作单纯认真细致','重点是真实与实效。'],['态度与作风','兢兢业业','小心谨慎认真负责地工作','工作、岗位、职业态度','褒义','误作思考深刻','重点是勤勉负责。'],['态度与作风','一丝不苟','做事认真丝毫不马虎','工作、操作、研究、细节','褒义','误作工作效率高','重点是细致严谨。'],['态度与作风','精益求精','已经很好还要求更好','技术、产品、工艺、学术','褒义','     return originalError && originalError.apply(console, arguments);
  };
  window.addEventListener("error", function(event) {
    emit("error", [event.message || "Script error", event.filename || "", event.lineno || ""]);
  });
  window.addEventListener("unhandledrejection", function(event) {
    emit("unhandledrejection", [event.reason || "Unhandled promise rejection"]);
  });
})();
</script>
